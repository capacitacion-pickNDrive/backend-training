name: Strapi CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: CI
        uses: actions/checkout@v4

      - name: Config
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start Strapi and wait
        run: |
          npm run start &
          npx wait-on http://localhost:1337