name: Strapi CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t strapi-app .

      - name: Run Strapi container
        run: |
          docker run -d --name strapi-ci -p 1337:1337 strapi-app
          npx -y wait-on http://localhost:1337 --timeout 60000

      - name: Verify Strapi
        run: curl -f http://localhost:1337

      - name: Stop Strapi container
        run: docker stop strapi-ci