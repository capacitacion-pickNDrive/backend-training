name: CI Strapi

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

jobs:
  ci:
    name: Strapi CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build admin panel
        run: npm run build
